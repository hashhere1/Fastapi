<!DOCTYPE html>
<html>

<head>
    <title>User Profile</title>
</head>

<body>

    <h1>User Profile</h1>

    <!-- Display validation/upload errors -->
    {% if errors %}
        <ul style="color: red;">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}


    <!-- Display user information when editing -->
    {% if user %}

        <p style="color: green;">
            User loaded successfully! (ID: {{ user.id }})
        </p>

        {% if user.profile_pic %}

            <img
                src="/uploads/{{ user.profile_pic }}"
                alt="Profile Picture"
                width="150"
                height="150"
            >

            <br>
            <br>

        {% endif %}

    {% endif %}


    <!-- Create / Update form -->
    <form
        id="userForm"
        enctype="multipart/form-data"
    >

        <label>Name:</label>

        <input
            type="text"
            name="name"
            value="{{ user.name if user else '' }}"
            required
        >

        <br>
        <br>


        <label>Email:</label>

        <input
            type="email"
            name="email"
            value="{{ user.email if user else '' }}"
            required
        >

        <br>
        <br>


        <label>Bio:</label>

        <textarea name="bio">{{ user.bio if user else '' }}</textarea>

        <br>
        <br>


        <label>Profile Picture:</label>

        <input
            type="file"
            name="profile_pic"
            accept="image/*"
            {% if not user %}required{% endif %}
        >

        <br>
        <br>


        <button type="submit">

            {% if user %}
                Update
            {% else %}
                Create
            {% endif %}

        </button>

    </form>


    <br>


    <!-- Delete button only when editing an existing user -->
    {% if user %}

        <button
            id="deleteBtn"
            style="background-color: red; color: white;"
        >
            Delete User
        </button>

        <br>
        <br>

    {% endif %}


    <a href="/users">
        Back to Users
    </a>


    <script>

        const form = document.getElementById("userForm");

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const formData = new FormData(form);


                {% if user %}

                    const url = "/users/{{ user.id }}";
                    const method = "PATCH";

                {% else %}

                    const url = "/users";
                    const method = "POST";

                {% endif %}


                const response = await fetch(
                    url,
                    {
                        method: method,
                        body: formData
                    }
                );


                if (response.ok) {

                    window.location.href = "/users";

                } else {

                    // Backend may return HTML when showing
                    // validation/upload errors.
                    const html = await response.text();

                    document.open();
                    document.write(html);
                    document.close();

                }

            }
        );


        {% if user %}

            const deleteBtn =
                document.getElementById("deleteBtn");


            deleteBtn.addEventListener(
                "click",
                async function() {

                    const confirmDelete = confirm(
                        "Are you sure you want to delete this user?"
                    );


                    if (confirmDelete) {

                        const response = await fetch(
                            "/users/{{ user.id }}",
                            {
                                method: "DELETE"
                            }
                        );


                        if (response.ok) {

                            window.location.href = "/users";

                        } else {

                            alert(
                                "Failed to delete user."
                            );

                        }

                    }

                }
            );

        {% endif %}

    </script>

</body>

</html>
