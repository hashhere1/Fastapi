<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
</head>
<body>

    <h1>All Users</h1>

    <a href="/users/new">Create New User</a>

    <hr>

    {% if users %}
        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Profile Picture</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Bio</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>

                        <td>
                            <img
                                src="/{{ user.profile_pic }}"
                                alt="Profile picture"
                                width="80"
                                height="80"
                            >
                        </td>

                        <td>{{ user.name }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.bio }}</td>

                        <td>
                            <a href="/users/{{ user.id }}">
                                View / Edit
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No users found.</p>
    {% endif %}

</body>
</html>
